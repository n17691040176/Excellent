# ===========================================
# Excellent App - 生产环境 Docker Compose 修复版
# 启动命令: docker compose -f docker-compose.prod.yml up -d
# 停止命令: docker compose -f docker-compose.prod.yml down
# ===========================================
# 全局日志统一配置：限制日志大小，防止磁盘打满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 自定义网桥网络，隔离多项目容器网络，避免DNS/端口冲突
networks:
  excellent-net:
    driver: bridge

# 持久化数据卷（独立于容器，删除容器不丢失数据）
volumes:
  mysql_data:
  server_uploads:

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0
    container_name: excellent-mysql
    restart: unless-stopped
    logging: *default-logging
    networks: [excellent-net]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: excellent_app
      MYSQL_USER: excellent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # ports:
    #   - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=300
      - --wait_timeout=28800
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Redis 7 缓存/消息队列服务（修复command多行语法错误）
  redis:
    image: redis:7-alpine
    container_name: excellent-redis
    restart: unless-stopped
    logging: *default-logging
    networks: [excellent-net]
    # 修复：每行参数增加 "- " 短横线，符合YAML数组规范
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  # 后端API服务（Python服务）
  server:
    image: crpi-190lmhdk7u2enek8.cn-hangzhou.personal.cr.aliyuncs.com/excellent-project/excellent:server-latest
    container_name: excellent-server
    restart: unless-stopped
    logging: *default-logging
    networks: [excellent-net]
    env_file:
      - ${ALIPAY_ENV_FILE:-/www/wwwroot/excellent/server/.env.alipay.local}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ENV: production
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: excellent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: excellent_app
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zyhskj.shop,https://admin.zyhskj.shop}
      TENCENT_COS_ENABLED: ${TENCENT_COS_ENABLED:-false}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-nanjing}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_ENDPOINT: ${TENCENT_COS_ENDPOINT:-}
      TENCENT_COS_PUBLIC_BASE_URL: ${TENCENT_COS_PUBLIC_BASE_URL:-}
      TENCENT_COS_PRODUCT_PREFIX: ${TENCENT_COS_PRODUCT_PREFIX:-products}
      TENCENT_COS_MAX_UPLOAD_SIZE: ${TENCENT_COS_MAX_UPLOAD_SIZE:-5242880}
      DYNPNS_ENABLED: "true"
      DYNPNS_ACCESS_KEY_ID: ${DYNPNS_ACCESS_KEY_ID:-}
      DYNPNS_ACCESS_KEY_SECRET: ${DYNPNS_ACCESS_KEY_SECRET:-}
      DYNPNS_SIGNATURE_SECRET: ${DYNPNS_SIGNATURE_SECRET:-}
      DYNPNS_APP_KEY: ${DYNPNS_APP_KEY:-}
      SMS_ENABLED: "true"
      SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - ${PAYMENT_SECRETS_DIR:-/www/wwwroot/excellent/secrets}:/run/secrets:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # 管理后台前端（Nginx静态站点）
  admin-web:
    image: crpi-190lmhdk7u2enek8.cn-hangzhou.personal.cr.aliyuncs.com/excellent-project/excellent:admin-web-latest
    container_name: excellent-admin-web
    restart: unless-stopped
    logging: *default-logging
    networks: [excellent-net]
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8081:80"

  # 移动端H5前端（Nginx静态站点）
  mobile-app:
    image: crpi-190lmhdk7u2enek8.cn-hangzhou.personal.cr.aliyuncs.com/excellent-project/excellent:mobile-uniNew2-latest
    container_name: excellent-mobile-app
    restart: unless-stopped
    logging: *default-logging
    networks: [excellent-net]
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8082:80"
